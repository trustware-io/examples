<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webhook receiver</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #14171c; --muted: #5b6472; --border: #e2e5ea;
    --ok: #0f7b4a; --ok-bg: #e5f5ec; --bad: #b42318; --bad-bg: #fdecea; --chip: #eef1f5; --accent: #3b5bdb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1216; --panel: #171b21; --text: #e8ebef; --muted: #98a2b3; --border: #2a3039;
      --ok: #4ade80; --ok-bg: #12301f; --bad: #f87171; --bad-bg: #3a1616; --chip: #222831; --accent: #8ea2ff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; min-width: 140px; }
  .stat b { display: block; font-size: 22px; }
  .stat span { color: var(--muted); font-size: 13px; }
  h2 { font-size: 15px; margin: 24px 0 8px; color: var(--muted); font-weight: 600; }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; animation: in .35s ease-out; }
  .card.bad { border-color: var(--bad); }
  .type { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 600; }
  .meta { color: var(--muted); font-size: 13px; grid-column: 1 / -1; overflow-wrap: anywhere; }
  .chips { display: flex; gap: 6px; align-items: center; }
  .chip { background: var(--chip); border-radius: 999px; padding: 2px 9px; font-size: 12px; }
  .chip.ok { background: var(--ok-bg); color: var(--ok); font-weight: 600; }
  .chip.bad { background: var(--bad-bg); color: var(--bad); font-weight: 600; }
  .chip.test { color: var(--accent); }
  .empty { color: var(--muted); font-style: italic; }
  @keyframes in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<main>
  <h1>Trustware webhooks: receiver</h1>
  <p class="sub">Every delivery is checked against its Standard Webhooks v1 signature before it is shown here.</p>
  <div class="stats">
    <div class="stat"><b id="n-ok">0</b><span>verified deliveries</span></div>
    <div class="stat"><b id="n-bad">0</b><span>rejected requests</span></div>
  </div>
  <h2>Verified deliveries, newest first</h2>
  <div class="list" id="ok"><p class="empty">Waiting for a delivery.</p></div>
  <h2>Rejected requests</h2>
  <div class="list" id="bad"><p class="empty">None.</p></div>
</main>
<script>
  // Every value from a request is rendered with textContent, never as HTML.
  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }
  function chips(items) {
    const box = el("div", "chips");
    for (const [cls, text] of items) box.append(el("span", "chip " + cls, text));
    return box;
  }
  function time(iso) { return new Date(iso).toLocaleTimeString(); }

  function renderOk(events) {
    const list = document.getElementById("ok");
    document.getElementById("n-ok").textContent = String(events.length);
    if (events.length === 0) return;
    list.replaceChildren(...events.slice().reverse().map((e) => {
      const env = e.envelope;
      const data = env.data || {};
      const card = el("div", "card");
      card.append(el("div", "type", env.type));
      const tags = [["ok", "signature verified"], ["", "seq " + env.sequence]];
      if (env.test) tags.push(["test", "test event"]);
      if (e.duplicate) tags.push(["bad", "duplicate"]);
      if (!e.known_type) tags.push(["bad", "unknown type"]);
      card.append(chips(tags));
      const parts = [time(e.received_at)];
      if (data.status) parts.push("status " + data.status);
      // v2 URLs send camelCase data, v1 URLs snake_case.
      const intentId = data.intentId || data.intent_id;
      const sourceTxHash = data.sourceTxHash || data.source_tx_hash;
      if (intentId) parts.push("intent " + intentId);
      if (sourceTxHash) parts.push("tx " + sourceTxHash.slice(0, 16) + "…");
      card.append(el("div", "meta", parts.join(" · ")));
      return card;
    }));
  }
  function renderBad(rejections) {
    const list = document.getElementById("bad");
    document.getElementById("n-bad").textContent = String(rejections.length);
    if (rejections.length === 0) return;
    list.replaceChildren(...rejections.slice().reverse().map((r) => {
      const card = el("div", "card bad");
      card.append(el("div", "type", "rejected: " + r.reason));
      card.append(chips([["bad", "HTTP 400"]]));
      card.append(el("div", "meta", time(r.received_at) + " · webhook-id " + (r.webhook_id || "(none)")));
      return card;
    }));
  }
  let lastOk = -1, lastBad = -1;
  async function poll() {
    try {
      const [ok, bad] = await Promise.all([fetch("/events").then((r) => r.json()), fetch("/rejections").then((r) => r.json())]);
      if (ok.length !== lastOk) { renderOk(ok); lastOk = ok.length; }
      if (bad.length !== lastBad) { renderBad(bad); lastBad = bad.length; }
    } catch (err) {
      console.error("poll failed", err);
    }
    setTimeout(poll, 1000);
  }
  poll();
</script>
</body>
</html>
